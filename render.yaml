services:
  - type: web
    name: crono-mobil-delvac-redbull
    runtime: node
    plan: free
    region: virginia
    branch: Redbull
    buildCommand: npm ci --prefix backend --include=dev && npm ci --prefix frontend --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false

